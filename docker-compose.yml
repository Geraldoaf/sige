services:
  sige-api:
    build: .
    image: sige-app:latest
    container_name: sige-api-server
    # Publicado só no loopback: a API executa código arbitrário e não deve
    # ficar exposta em todas as interfaces por padrão. Para acesso remoto,
    # coloque um proxy reverso com TLS na frente — o X-API-Key trafega em
    # texto claro em HTTP.
    ports:
      - "127.0.0.1:8080:8080"

    # Contenção do container inteiro, como segunda camada: os cgroups por
    # execução limitam CADA sandbox, mas não a soma deles. Dimensione por
    #   mem_limit >= SIGE_MAX_CONCURRENT_SANDBOXES × SIGE_CEILING_MEMORY_MB
    #               + folga para o daemon
    # Com os padrões (8 × 512 MB) o pior caso teórico passa de 4 GB; 4g cobre
    # com folga o uso real (o padrão por execução é 50 MB). Se elevar o teto
    # de memória ou a concorrência, eleve isto junto.
    mem_limit: 4g
    pids_limit: 1024
    cpus: 4.0

    cap_add:
      # Necessário para gerenciamento de cgroups v2, namespaces e pivot_root
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
      # Necessário para permitir file capabilities (setcap) no executável do sandbox
      - no-new-privileges:false

    cgroup: private

    env_file:
      - path: .env
        required: false

    volumes:
      # Volume para persistência da API key gerada
      - sige-state:/var/lib/sige

    restart: unless-stopped

volumes:
  sige-state:
